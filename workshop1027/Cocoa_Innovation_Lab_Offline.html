<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>可可創新實驗室 Cocoa Innovation Lab (離線完整版)</title>
    <script src="cocoa_lab_offline/vendor/tailwindcss.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", "Microsoft JhengHei", sans-serif;
            background: #2b1815;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .site-nav-btn {
            padding: 8px 16px;
            border-radius: 9999px;
            font-size: 14px;
            font-weight: 800;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: #f5ebe6;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            cursor: pointer;
            white-space: nowrap;
        }
        .site-nav-btn:hover {
            background: rgba(255, 255, 255, 0.18);
            transform: translateY(-1px);
        }
        .site-nav-btn.active {
            background: linear-gradient(135deg, #d97706, #ea580c);
            color: #ffffff;
            border-color: #fbbf24;
            box-shadow: 0 4px 12px rgba(234, 88, 12, 0.45);
        }
    </style>
</head>
<body>
    <!-- Top Google Sites Offline Navigation Bar -->
    <header class="bg-[#211310] text-white px-4 py-2.5 border-b border-amber-800/60 shadow-lg flex flex-wrap items-center justify-between gap-3 z-50 shrink-0">
        <div class="flex items-center gap-3">
            <span class="text-2xl">🍫</span>
            <div>
                <div class="flex items-center gap-2">
                    <h1 class="text-base md:text-lg font-black tracking-wide text-amber-100">可可創新實驗室 Cocoa Innovation Lab</h1>
                    <span class="bg-emerald-600/90 text-white text-[11px] font-black px-2 py-0.5 rounded-full border border-emerald-400/50">⚡ 100% 離線講解版</span>
                </div>
                <p class="text-[11px] text-amber-200/75 font-medium">Google Sites 完整鏡像：https://sites.google.com/view/chocolate0323/intro</p>
            </div>
        </div>

        <!-- 6 Subpages Switcher matching Google Sites Navbar -->
        <nav class="flex items-center gap-1.5 overflow-x-auto py-0.5">
            <button onclick="switchSitePage('cocoa_lab_offline/intro.html', this)" class="site-nav-btn active">
                <span>🏠</span> Intro 實驗室總覽
            </button>
            <button onclick="switchSitePage('cocoa_lab_offline/history.html', this)" class="site-nav-btn">
                <span>🌍</span> History 歷史與全球貿易
            </button>
            <button onclick="switchSitePage('cocoa_lab_offline/english.html', this)" class="site-nav-btn">
                <span>🗣️</span> English 英文 Hook 挑戰
            </button>
            <button onclick="switchSitePage('cocoa_lab_offline/math.html', this)" class="site-nav-btn">
                <span>📐</span> Math 數學期望值
            </button>
            <button onclick="switchSitePage('cocoa_lab_offline/chemistry.html', this)" class="site-nav-btn">
                <span>🧪</span> Chemistry 化學特性與熔岩
            </button>
            <button onclick="switchSitePage('cocoa_lab_offline/home_economics.html', this)" class="site-nav-btn">
                <span>📖</span> Home Economics 實作、手工書
            </button>
        </nav>

        <div class="flex items-center gap-2">
            <a href="https://sites.google.com/view/chocolate0323/intro" target="_blank" rel="noopener" class="text-xs font-bold text-amber-300 hover:text-amber-100 underline px-2 py-1">
                線上原網址 ↗
            </a>
        </div>
    </header>

    <!-- Main Content Iframe -->
    <main class="flex-1 w-full bg-[#FDFBF7] relative overflow-hidden">
        <iframe id="cocoaSiteFrame" src="cocoa_lab_offline/intro.html" class="w-full h-full border-0" title="可可創新實驗室離線內容"></iframe>
    </main>

    <script>
        function switchSitePage(url, btnEl) {
            document.getElementById('cocoaSiteFrame').src = url;
            document.querySelectorAll('.site-nav-btn').forEach(b => b.classList.remove('active'));
            if (btnEl) btnEl.classList.add('active');
        }
        // Support URL hash for direct subpage opening, e.g. Cocoa_Innovation_Lab_Offline.html#english
        window.addEventListener('DOMContentLoaded', () => {
            const hash = window.location.hash.replace('#', '');
            const map = {
                'intro': 0,
                'history': 1,
                'english': 2,
                'math': 3,
                'chemistry': 4,
                'home_economics': 5
            };
            if (hash in map) {
                const btns = document.querySelectorAll('.site-nav-btn');
                if (btns[map[hash]]) btns[map[hash]].click();
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>數學好簡單｜可可創新實驗室</title>
    <style>
        :root {
            --dopamine-pink: #FF85D0;
            --dopamine-yellow: #FFDE59;
            --dopamine-teal: #4ECDC4;
            --dopamine-orange: #FF914D;
            --bg-color: #FFF9FE;
        }

        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: var(--bg-color);
            padding: 40px;
            background-image: radial-gradient(var(--dopamine-yellow) 1px, transparent 1px);
            background-size: 30px 30px;
        }

        .worksheet-container { max-width: 1000px; margin: 0 auto; }

        header {
            display: flex;
            align-items: center;
            gap: 30px;
            margin-bottom: 50px;
            border: 6px solid var(--dopamine-pink);
            padding: 25px;
            background: white;
            border-radius: 40px;
            box-shadow: 15px 15px 0px var(--dopamine-teal);
        }

        .avatar-area { text-align: center; }
        .avatar-circle {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            border: 5px solid var(--dopamine-yellow);
            overflow: hidden;
            background: #fdfdfd;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .avatar-circle img { width: 100%; height: 100%; object-fit: cover; }

        .group-section {
            background: white;
            border: 4px solid var(--dopamine-teal);
            border-radius: 35px;
            padding: 30px;
            margin-bottom: 60px;
            box-shadow: 12px 12px 0px var(--dopamine-yellow);
        }

        .tag { background: var(--dopamine-pink); color: white; padding: 5px 20px; border-radius: 50px; font-weight: bold; }
        .formula-box { background: #FFF4E0; border: 2px dashed var(--dopamine-orange); border-radius: 20px; padding: 15px; text-align: center; margin: 20px 0; }
        .example-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 25px; font-size: 0.9em; }
        .ex-card { border: 2px solid #F0F0F0; border-radius: 20px; padding: 15px; }

        .input-card { background: #F0FBFA; border: 2px solid var(--dopamine-teal); border-radius: 20px; padding: 20px; margin-bottom: 20px; }
        .proposal-table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
        .proposal-table td { border: 2px solid var(--dopamine-pink); padding: 12px; }
        .label-cell { background: #FFE5F4; color: var(--dopamine-pink); font-weight: bold; width: 120px; }

        textarea, input[type="text"] { width: 100%; border: none; background: transparent; font-size: 1.1em; outline: none; font-family: inherit; resize: none; }

        .ceo-box { border: 3px solid var(--dopamine-orange); border-radius: 20px; overflow: hidden; }
        .ceo-head { background: var(--dopamine-orange); color: white; padding: 10px 20px; font-weight: bold; }
        .ceo-body { padding: 20px; display: grid; grid-template-columns: 1fr 2fr; gap: 20px; }
    </style>
</head>
<body>

<div class="worksheet-container">
    <header>
        <div class="avatar-area">
            <div class="avatar-circle">
                <img id="head-img" src="../web_photos/cocoa_lab_assets/fT3kPCn4_Gemini-Generated-Image.png" alt="頭像">
            </div>
            </div>
        <div>
            <h1 style="color: var(--dopamine-pink);">🍭 可可創新實驗室：期望值定價學習單</h1>
            <p><strong>Hi Everyone！</strong> 讓我們ㄧ起掌握商業決策邏輯吧！</p>
        </div>
    </header>

    <div id="content-main"></div>
</div>

<script>
    // 保留此 function 以確保程式碼結構完整性
    function changeImg() {
        const url = document.getElementById('input-url')?.value;
        if(url) document.getElementById('head-img').src = url;
    }

    const chocolateNames = {
        'C': '抹茶岩鹽 Matcha Rock Salt',
        'D': '紅寶石莓果 Ruby Berry',
        'E': '焦糖脆餅 Caramel Biscoff',
        'F': '海鹽藍色生死戀 Sea Salt Blue',
        'G': '跳跳糖魔幻波波 Magic Pop'
    };

    const letters = ['C', 'D', 'E', 'F', 'G'];
    const container = document.getElementById('content-main');

    letters.forEach(L => {
        const section = document.createElement('div');
        section.className = 'group-section';
        section.innerHTML = `
            <div class="tag">策略組別：${L} - ${chocolateNames[L]}</div>
            <div class="formula-box">
                <strong>期望值公式：E(X) = (預期獲利 Profit × 成功機率 P_Success) + (預期虧損 Loss × 失敗機率 P_Fail)</strong>
            </div>

            <div class="example-grid">
                <div class="ex-card"><strong>策略 A (100元)</strong><br>獲利: 70 | 成功率: 30% | 失敗率: 70%<br>計算：(70×0.3)+(-30×0.7)=0元</div>
                <div class="ex-card"><strong>策略 B (50元)</strong><br>獲利: 20 | 成功率: 90% | 失敗率: 10%<br>計算：(20×0.9)+(-30×0.1)=15元</div>
            </div>

            <div class="input-card">
                <h3>🚀 策略 ${L}：${chocolateNames[L]} 定價設定</h3>
                單件獲利：<input type="text" style="width:60px; border-bottom:1px solid #ccc"> 元 | 
                成功率：<input type="text" style="width:60px; border-bottom:1px solid #ccc"> % | 
                失敗率：<input type="text" style="width:60px; border-bottom:1px solid #ccc"> % (Loss = -30)<br><br>
                <strong>計算：</strong><input type="text" placeholder="請在此寫下 E(X) 的計算過程與結果">
            </div>

            <table class="proposal-table">
                <tr><td colspan="2" style="background:#FFE5F4; text-align:center; font-weight:bold;">👉 小組商業定價企劃書（精簡版）</td></tr>
                <tr><td class="label-cell">定位：</td><td><input type="text" placeholder="產品定位..."></td></tr>
                <tr><td class="label-cell">策略說明：</td><td><textarea rows="2" placeholder="針對 ${chocolateNames[L]} 的定價策略說明..."></textarea></td></tr>
                <tr><td class="label-cell">優點：</td><td><textarea rows="1" placeholder="優點..."></textarea></td></tr>
                <tr><td class="label-cell">風險：</td><td><textarea rows="1" placeholder="風險..."></textarea></td></tr>
                <tr><td class="label-cell">期望值：</td><td><input type="text" placeholder="期望值結果"></td></tr>
            </table>

            <div class="ceo-box">
                <div class="ceo-head">👑 CEO 最終決策 & 理由</div>
                <div class="ceo-body">
                    <div><strong>決策：</strong><br><input type="text" placeholder="採納 / 駁回"></div>
                    <div style="border-left: 2px solid #eee; padding-left:15px">
                        <strong>理由：</strong><textarea rows="2" placeholder="為什麼做出這個決定？"></textarea>
                    </div>
                </div>
            </div>
        `;
        container.appendChild(section);
    });
</script>

</body>
</html>

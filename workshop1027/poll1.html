<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>即時互動調查 1 ── 雙語/跨域教學挑戰</title>
    <script src="web_photos/vendor/tailwindcss.js"></script>
    <link href="web_photos/vendor/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-[#f8f5eb] text-slate-800 font-sans p-4 min-h-screen flex flex-col justify-center items-center">
    <div class="max-w-md w-full bg-white rounded-2xl p-6 shadow-xl border border-[#efe8d3]">
        <div class="inline-flex items-center gap-2 px-3 py-1 bg-[#efe8d3] text-[#0f766e] rounded-full text-xs font-bold mb-3">
            <i class="fa-solid fa-vote-yea"></i> Teacher Miffy 線上研習即時投票
        </div>

        <h2 class="text-xl font-black text-slate-800 mb-2">老師們在推動雙語/跨域教學時，最常遇到的挑戰？</h2>
        <p class="text-xs text-slate-500 mb-4">請點選下方選項投下您的一票 (可複選)：</p>

        <form id="pollForm" class="space-y-3">
            <label class="flex items-center gap-3 p-3 rounded-xl border border-sand-200 bg-[#fdfbf7] cursor-pointer hover:bg-[#efe8d3]/50 transition">
                <input type="checkbox" name="option" value="1" class="w-5 h-5 text-teal-600 rounded">
                <span class="text-sm font-medium text-slate-700">😭 學生害怕開口，語言焦慮高</span>
            </label>

            <label class="flex items-center gap-3 p-3 rounded-xl border border-sand-200 bg-[#fdfbf7] cursor-pointer hover:bg-[#efe8d3]/50 transition">
                <input type="checkbox" name="option" value="2" class="w-5 h-5 text-teal-600 rounded">
                <span class="text-sm font-medium text-slate-700">⏰ 課綱進度吃緊，抽不出時間</span>
            </label>

            <label class="flex items-center gap-3 p-3 rounded-xl border border-sand-200 bg-[#fdfbf7] cursor-pointer hover:bg-[#efe8d3]/50 transition">
                <input type="checkbox" name="option" value="3" class="w-5 h-5 text-teal-600 rounded">
                <span class="text-sm font-medium text-slate-700">🤯 活動放得開，但產出收不回來</span>
            </label>

            <label class="flex items-center gap-3 p-3 rounded-xl border border-sand-200 bg-[#fdfbf7] cursor-pointer hover:bg-[#efe8d3]/50 transition">
                <input type="checkbox" name="option" value="4" class="w-5 h-5 text-teal-600 rounded">
                <span class="text-sm font-medium text-slate-700">💻 數位工具太複雜，不知如何結合</span>
            </label>

            <button type="button" onclick="submitVote()" class="w-full py-3 bg-[#0f766e] text-white font-bold rounded-xl text-sm hover:bg-[#115e59] transition shadow-lg mt-4">
                <i class="fa-solid fa-paper-plane mr-2"></i> 送出投票
            </button>
        </form>

        <div id="thankYou" class="hidden mt-6 pt-4 border-t border-sand-200 text-center">
            <div class="w-12 h-12 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto mb-2 text-xl">
                <i class="fa-solid fa-check"></i>
            </div>
            <h3 class="font-bold text-slate-800 text-base mb-1">投票成功！感謝您的參與！</h3>
            <p class="text-xs text-slate-500">請觀看螢幕講者即時解析。</p>
        </div>
    </div>

    <script>
        function submitVote() {
            document.getElementById('pollForm').classList.add('hidden');
            document.getElementById('thankYou').classList.remove('hidden');
        }
    </script>
</body>
</html>

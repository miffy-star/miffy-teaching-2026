<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Miffy's English Projection Book｜國一＋國二</title><style>
:root{--navy:#15324b;--ink:#162b3a;--paper:#fffdf8;--cream:#f5f0e7;--red:#d65c43;--gold:#f0bd52;--green:#2e705d}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Arial,"Noto Sans TC",sans-serif}button{font:inherit;cursor:pointer}.top{display:flex;justify-content:space-between;align-items:center;padding:20px 5vw;background:var(--navy);color:#fff}.top small{color:#ffcf6b;font-weight:900;letter-spacing:.12em}.top h1{margin:5px 0;font-size:clamp(25px,3vw,40px)}.badge{border:1px solid #ffffff66;border-radius:40px;padding:10px 16px;font-weight:900}.grades{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:1180px;margin:20px auto;padding:0 16px}.grades button,.lessons button,.tabs button{border:2px solid var(--navy);background:#fff;color:var(--navy);font-weight:900}.grades button{border-radius:14px;padding:15px;font-size:20px}.grades .on,.tabs .on{background:var(--navy);color:#fff;box-shadow:4px 4px var(--gold)}.lessons{position:sticky;top:0;z-index:3;display:grid;grid-template-columns:repeat(6,1fr);background:#fff;border-bottom:2px solid var(--navy)}.lessons button{border-width:0 1px 0 0;padding:12px 5px}.lessons .on{background:var(--gold);box-shadow:inset 0 -5px var(--red)}.lessons b{display:block;font-size:21px}.lessons span{font-size:11px}.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;max-width:1250px;margin:auto;padding:38px 25px 24px}.hero small{color:var(--red);font-weight:900}.hero h2{margin:7px 0;font-size:clamp(37px,6vw,68px);line-height:1}.hero p{margin:0;font-size:21px;font-weight:700;color:#526776}.source{border:2px solid var(--green);border-radius:14px;padding:12px;background:#e9f4ee;color:var(--green);font-weight:900}.tabs{display:flex;gap:8px;max-width:1220px;margin:0 auto 18px;padding:0 16px;overflow:auto}.tabs button{min-width:125px;flex:1;border-radius:10px;padding:12px}.page{position:relative;max-width:1180px;min-height:600px;margin:0 auto 45px;border:2px solid var(--navy);border-radius:22px;padding:clamp(24px,5vw,58px);background:var(--paper);box-shadow:8px 8px var(--navy)}.head{display:flex;align-items:center;gap:16px;margin-bottom:28px}.head b{display:grid;width:55px;height:55px;place-items:center;border-radius:50%;background:var(--red);color:#fff;font-size:22px}.head h3{margin:0;font-size:clamp(29px,5vw,50px)}.head p{margin:4px 0;color:#647782;font-weight:700}.dialogue{display:flex;flex-direction:column;gap:13px}.line{display:grid;grid-template-columns:170px 1fr;gap:15px}.line b{padding:8px 12px;border-radius:9px;background:#e3ecf0;text-align:right;font-size:19px}.line p,.scene{margin:0;font-size:clamp(24px,3vw,35px);line-height:1.45;font-weight:700}.scene{border-left:7px solid var(--gold);padding:12px 18px;background:#fff5db;color:#56636b;font-style:italic}.reading p{margin:0;padding:10px 14px;font-family:Georgia,serif;font-size:clamp(27px,3.3vw,41px);line-height:1.55}.reading p:nth-child(odd){background:#f4f0e7}.note{border-left:6px solid var(--green);padding:12px 16px;background:#e9f4ee;font-weight:800}.vocab{display:grid;grid-template-columns:1fr 1fr;gap:13px}.word{border:1.5px solid #b9c5c8;border-radius:13px;padding:15px;background:#fff}.word b{font-size:clamp(23px,2.7vw,33px);color:var(--navy)}.word span{margin-left:12px;color:var(--red);font-size:18px;font-weight:900}.word p{border-top:1px dashed #aaa;padding-top:9px;font-size:18px;font-weight:700}.grammar{display:grid;grid-template-columns:1fr 1fr;gap:18px}.box{border:2px solid var(--navy);border-radius:16px;padding:20px;background:#fff}.box h4{margin:0 0 14px;color:var(--red);font-size:20px}.box p{font-size:22px;line-height:1.45;font-weight:800}.checks{grid-column:1/-1}.checks details{margin:10px 0;border:1px solid #aaa;border-radius:10px;font-size:21px;font-weight:800}.checks summary,.checks details p{padding:14px;margin:0}.checks details p{border-top:1px dashed #aaa;color:var(--green)}.quiz-card{min-height:300px;border:3px solid var(--navy);border-radius:22px;padding:30px;background:#fff8e8;box-shadow:7px 7px var(--gold)}.quiz-card h3{font-size:clamp(33px,5vw,58px)}.quiz-card p{border-top:3px dashed var(--red);padding-top:20px;color:var(--green);font-size:clamp(30px,4vw,46px);font-weight:900}.actions,.modes{display:flex;gap:10px;margin:20px 0}.actions button,.modes button,.spinbtn{flex:1;border:2px solid var(--navy);border-radius:12px;padding:13px;background:var(--navy);color:#fff;font-weight:900}.modes button{background:#fff;color:var(--navy)}.modes .on,.actions button:last-child,.spinbtn{background:var(--gold);color:var(--navy)}.wheel-layout{display:grid;grid-template-columns:1fr 1fr;gap:28px}.wheel-stage{text-align:center}.pointer{position:relative;z-index:2;display:block;margin-bottom:-18px;color:var(--red);font-size:40px}.wheel{display:grid;width:min(410px,78vw);aspect-ratio:1;margin:auto;place-items:center;border:9px solid var(--navy);border-radius:50%;transition:transform 1.7s cubic-bezier(.12,.75,.18,1);box-shadow:7px 7px var(--gold)}.wheel b{display:grid;width:105px;aspect-ratio:1;place-items:center;border:5px solid var(--navy);border-radius:50%;background:#fff}.picked{color:var(--red);font-size:48px;font-weight:900}.roster textarea{width:100%;min-height:330px;border:2px solid #91a5ad;border-radius:12px;padding:13px;font-size:18px;line-height:1.6}.animal{display:grid;grid-template-columns:1fr 240px;gap:25px}.clue{border:3px solid var(--navy);border-radius:22px;padding:26px;background:#fff8e8;box-shadow:7px 7px var(--gold)}.clue p{font-size:clamp(30px,4vw,47px);font-weight:900}.answer{border-top:3px dashed var(--red);padding-top:18px;color:var(--green);font-size:40px;font-weight:900}.truth{border:2px solid var(--green);border-radius:16px;padding:22px;background:#e9f4ee}.truth p{font-size:23px;line-height:1.55;font-weight:700}@media(max-width:760px){.badge{display:none}.grades,.vocab,.grammar,.wheel-layout,.animal{grid-template-columns:1fr}.lessons span{display:none}.line{grid-template-columns:1fr}.line b{text-align:left;justify-self:start}.hero{align-items:flex-start;flex-direction:column}.page{margin:0 10px 35px}.checks{grid-column:auto}}@media print{.top,.grades,.lessons,.tabs{display:none}.page{border:0;box-shadow:none;max-width:none}}
</style></head><body><header class="top"><div><small>MIFFY'S TEACHER VIEW · 國一＋國二</small><h1>English Projection Book</h1></div><span class="badge">教師專用｜大字投影</span></header><div id="app"></div><script>const DATA={"grade7":[{"theme":"Animals & Descriptions","focus":"be 動詞、單複數與動物描述","dialogue":[{"text":"(A game show is on.)"},{"speaker":"Judy","text":"Welcome to What’s This? I am Judy. Hello, David and Amy. Are you ready for the game?"},{"speaker":"David & Amy","text":"Yes!"},{"speaker":"Judy","text":"Look at this picture. What is this?"},{"speaker":"Amy","text":"It’s a duck."},{"speaker":"Judy","text":"No, it isn’t."},{"speaker":"David","text":"It’s a goose."},{"speaker":"Judy","text":"Yes, it is. Ten points for you!"},{"speaker":"Judy","text":"Look at this picture. What are these?"},{"speaker":"David","text":"Those are lions."},{"speaker":"Judy","text":"Sorry. They are not lions."},{"speaker":"Amy","text":"They are tigers!"},{"speaker":"Judy","text":"You are right! You are a smart cookie! Ten points for you! And, what’s this?"},{"speaker":"David","text":"It’s a monkey!"},{"speaker":"Judy","text":"I’m sorry, no."},{"speaker":"Amy","text":"Is it big and tall?"},{"speaker":"Judy","text":"Yes, it is."},{"speaker":"Amy","text":"It’s Bigfoot!"},{"speaker":"Judy","text":"That’s it! Ten more points! You are the winner!"}],"readingTitle":"Who Am I? — Bigfoot","reading":["I am tall and strong. I am not an elephant.","I am brown and hairy, but I am not a bear.","The forest is my home.","Fruit is my favorite food.","Yeti is my good friend.","Look! Those are my footprints.","They are very big.","I am Bigfoot."],"words":[{"w":"show","zh":"節目","extra":"a TV show；一字多義：表演、秀；show sb. sth. 給某人看某物"},{"w":"picture","zh":"圖畫","extra":"a picture of…；一字多義：照片；picture (v.) 想像"},{"w":"goose → geese","zh":"鵝（不規則複數）"},{"w":"point","zh":"分數","extra":"get / score points；一字多義：點、觀點；point at 指向"},{"w":"lion","zh":"獅子"},{"w":"monkey","zh":"猴子"},{"w":"more","zh":"更多的","extra":"ten more points 再十分"},{"w":"winner","zh":"贏家","extra":"the winner of…"},{"w":"bee / frog / zebra","zh":"蜜蜂／青蛙／斑馬"},{"w":"elephant / hippo","zh":"大象／河馬"},{"w":"mouse → mice","zh":"老鼠（不規則複數）","extra":"一字多義：電腦滑鼠"},{"w":"ant / sheep / goat","zh":"螞蟻／綿羊／山羊","extra":"sheep 單複數同形"},{"w":"angry","zh":"生氣的","extra":"be angry with sb."},{"w":"clean / dirty","zh":"乾淨的／髒的","extra":"clean 亦可作動詞：clean the table"},{"w":"strong","zh":"強壯的","extra":"strong coffee 濃咖啡；a strong feeling 強烈感受"},{"w":"brown / hairy","zh":"棕色的／毛茸茸的"},{"w":"bear","zh":"熊","extra":"一字多義：bear (v.) 忍受"},{"w":"fruit","zh":"水果","extra":"fruit 常作不可數或集合名詞"},{"w":"favorite","zh":"最喜愛的","extra":"favorite food；亦可作名詞：my favorite"},{"w":"forest / footprint","zh":"森林／腳印"}],"notes":["be ready for + 名詞；be ready to + 原形動詞","look at + 受詞","Those are… 對應複數；What are these/those?","and 連接相近特徵；but 引出對比"],"truth":"Bigfoot 與 Yeti 屬於民間傳說中的生物，沒有獲科學證實。本課以虛構猜謎文本練習推論與描述。"},{"theme":"Friends Around the World","focus":"身分、年齡、來源與明信片","dialogue":[{"text":"(At school)"},{"speaker":"Jenny","text":"What’s this?"},{"speaker":"Tina","text":"It’s a postcard from Annie."},{"speaker":"Jenny","text":"Who is Annie?"},{"speaker":"Tina","text":"She’s a friend from the USA."},{"speaker":"Jenny","text":"How old is she?"},{"speaker":"Tina","text":"She’s thirteen years old."},{"speaker":"Jenny","text":"What’s that on the postcard?"},{"speaker":"Tina","text":"It’s Walt Disney World. It’s very famous and beautiful."},{"speaker":"Jenny","text":"Is that postcard from her, too?"},{"speaker":"Tina","text":"No, it’s from Ben."},{"speaker":"Jenny","text":"Where is he from?"},{"speaker":"Tina","text":"He’s from Japan."},{"speaker":"Jenny","text":"Cool! Your friends are from all over the world."},{"speaker":"Tina","text":"Postcrossing."},{"speaker":"Jenny","text":"What is Postcrossing? Is it hard?"},{"speaker":"Tina","text":"No. It’s a piece of cake. Look."},{"speaker":"Jenny","text":"Wow! It’s really easy."},{"speaker":"Tina","text":"Oh, no! I’m late for my dance class."},{"speaker":"Jenny","text":"OK. See you tomorrow."}],"readingTitle":"A Postcard from Annie","reading":["Hello Tina,","My name is Annie. I am a junior high school student from the USA.","Walt Disney World is my favorite theme park.","The founder is Walt Disney. He is the father of many cartoon stars.","Mickey Mouse is my favorite. He is over 90 years old but still very cute.","Walt Disney World is a wonderful place. Come and have a great time!","Annie"],"words":[{"w":"postcard","zh":"明信片","extra":"a postcard from sb."},{"w":"the USA","zh":"美國","extra":"be from the USA"},{"w":"year(s) old","zh":"……歲"},{"w":"famous","zh":"有名的","extra":"be famous for…；be famous all over the world"},{"w":"beautiful","zh":"漂亮的"},{"w":"hard","zh":"困難的","extra":"hard for sb.；一字多義：堅硬的；work hard 努力地"},{"w":"easy","zh":"簡單的","extra":"It’s a piece of cake."},{"w":"late","zh":"遲的","extra":"be late for…；late at night 深夜"},{"w":"tomorrow","zh":"明天"},{"w":"family / farmer / housewife / clerk","zh":"家庭／農夫／家庭主婦／職員"},{"w":"actress","zh":"女演員"},{"w":"son / daughter","zh":"兒子／女兒","extra":"son 也可用來稱呼年輕男子"},{"w":"husband / wife","zh":"丈夫／妻子"},{"w":"junior high school","zh":"國中"},{"w":"star","zh":"明星","extra":"一字多義：星星"},{"w":"still","zh":"還、仍然"},{"w":"cute / wonderful","zh":"可愛的／極好的"},{"w":"place","zh":"地方","extra":"a place for + N/V-ing；一字多義：place (v.) 放置"},{"w":"theme park / founder / cartoon","zh":"主題樂園／創辦者／卡通"},{"w":"have a great time","zh":"玩得開心","extra":"= have fun"}],"notes":["a postcard from Annie：from 表示寄件來源","on the postcard 指印在明信片表面；in the photo 指照片內容","be from + 地方；Where is he/she from?","英文地址由小範圍寫到大範圍"],"truth":"Walt Disney 與 Mickey Mouse 的關係為真實文化背景；課文中的 Annie、Tina 與明信片內容屬教材情境。"},{"theme":"A Potluck Party","focus":"祈使句、餐具與邀請函","dialogue":[{"text":"(At Jason’s potluck)"},{"speaker":"Jason","text":"Hi, Rosa. Come on in! Please put your dish on the table."},{"speaker":"Rosa","text":"OK. Thanks."},{"speaker":"Ming","text":"Let’s try the beef noodles."},{"speaker":"Marco","text":"They’re really good."},{"speaker":"Ming","text":"Marco, let’s use chopsticks."},{"speaker":"Marco","text":"Oh, no. That’s not easy."},{"speaker":"Ming","text":"Just give it a shot!"},{"speaker":"Rosa","text":"Let’s have tacos."},{"speaker":"Jason","text":"They are delicious."},{"speaker":"Rosa","text":"Hey, guys. Don’t use chopsticks. Just use your hands."},{"speaker":"Marco","text":"That’s easy."},{"speaker":"Ming","text":"Hey, Marco, where is your dish?"},{"speaker":"Marco","text":"I’m sorry. I…"},{"speaker":"Jason","text":"It’s fine. Just bring TWO dishes next time."}],"readingTitle":"Jason’s Potluck Invitation","reading":["To: Ming; Rosa; Marco","Subject: Please come to my potluck","Hey everyone,","How are you doing? I’m doing great!","Please come to my house for a potluck.","It’s on Double Tenth Day, from 11 a.m. to 3 p.m.","Please bring your favorite dish and wear something from your country.","Don’t bring any drinks. Let’s have fun!","Your friend, Jason","P.S. Halloween is just around the corner. Let’s plan for it."],"words":[{"w":"please","zh":"請","extra":"句首或句尾；一字多義：please (v.) 取悅"},{"w":"put","zh":"放","extra":"put sth. on the table"},{"w":"dish","zh":"菜餚","extra":"favorite dish；一字多義：盤、碟"},{"w":"Let’s + V","zh":"讓我們……"},{"w":"try","zh":"嘗試","extra":"try + N；try to + V；give it a shot"},{"w":"beef noodles","zh":"牛肉麵"},{"w":"use","zh":"使用","extra":"use sth. to + V"},{"w":"chopsticks","zh":"筷子","extra":"a pair of chopsticks"},{"w":"delicious","zh":"美味的"},{"w":"guys","zh":"大家"},{"w":"just","zh":"就、只是"},{"w":"hand","zh":"手","extra":"by hand；give sb. a hand"},{"w":"bring","zh":"帶來","extra":"bring sth. to + 地方"},{"w":"party / invite / join","zh":"派對／邀請／參加","extra":"invite sb. to…；join + 團體或活動"},{"w":"glass / bowl / spoon / fork / plate / knife","zh":"杯、碗、匙、叉、盤、刀","extra":"knife → knives；a bowl of…"},{"w":"e-mail / everyone / house","zh":"電子郵件／每個人／房子"},{"w":"wear","zh":"穿戴","extra":"wear + 衣物；put on 強調穿上動作"},{"w":"something / any","zh":"某物／任何的"},{"w":"country","zh":"國家"},{"w":"fun","zh":"樂趣","extra":"have fun；sth. is fun"},{"w":"around the corner","zh":"即將到來"},{"w":"plan","zh":"計畫","extra":"plan for + N；plan to + V"}],"notes":["Come on in! 是口語的『請進』","Please + 原形動詞；Don’t + 原形動詞","on + 特定日期；from A to B","bring 是帶到說話者所在處；wear 表示穿戴狀態"],"truth":"Potluck 是每位參加者帶一道食物共享的聚餐形式；課文人物與派對為教材情境。"},{"theme":"A Gift Hunt","focus":"位置介系詞與 There is/are","dialogue":[{"text":"(Dr. Wildman’s animals are at the house. A surprise party is ready.)"},{"speaker":"All animals","text":"Surprise!"},{"speaker":"Hippo","text":"Let’s play a game."},{"speaker":"Dr. Wildman","text":"I love games!"},{"speaker":"Bird","text":"It’s a gift hunt. Your gifts are inside the house."},{"speaker":"Dr. Wildman","text":"Let’s get the ball rolling!"},{"speaker":"Monkey","text":"My gift is on the table."},{"speaker":"Dr. Wildman","text":"A banana!"},{"speaker":"Monkey","text":"No! That’s my lunch. Try again."},{"speaker":"Dr. Wildman","text":"Is it a banana pin?"},{"speaker":"Monkey","text":"Yes."},{"speaker":"Panda","text":"Dr. Wildman, my gift is under a chair."},{"speaker":"Dr. Wildman","text":"Wow! Bamboo chopsticks! You’re so kind!"},{"speaker":"Dr. Wildman","text":"What about you? Where is your gift?"},{"speaker":"Bird","text":"It’s in your jacket!"},{"speaker":"Dr. Wildman","text":"A thank-you card! I’m so happy!"},{"speaker":"All animals","text":"Happy Thanksgiving!"}],"readingTitle":"The Iron Animal","reading":["This is the Iron Animal. Dr. Wildman and his animal friends are here for the game.","There are two teams. Monkey, Hippo, and Panda are on Team Hard-working. Lion, Spider, and Tiger are on Team Smart.","There are three areas. Let’s take a look.","In Area A, Monkey is next to Lion. There are some bananas in Monkey’s pockets.","In Area B, Spider is in front of Hippo. They are very busy. There is a water bottle in Hippo’s bag.","In Area C, Panda is near Tiger. There are some bamboos over Panda’s shoulders.","All the players are ready for the game. Let’s cheer for them!"],"words":[{"w":"animal / surprise / gift","zh":"動物／驚喜／禮物","extra":"a gift for sb."},{"w":"love","zh":"愛、喜愛","extra":"love + N / V-ing"},{"w":"hunt","zh":"尋找","extra":"gift hunt；亦可作動詞"},{"w":"inside","zh":"在……裡面","extra":"inside the house"},{"w":"lunch / pin / jacket","zh":"午餐／別針／夾克"},{"w":"again","zh":"再一次","extra":"try again"},{"w":"so","zh":"非常","extra":"so + adj."},{"w":"kind","zh":"體貼的","extra":"It’s kind of sb. to + V"},{"w":"bamboo / Thanksgiving","zh":"竹子／感恩節"},{"w":"bathroom / bedroom / living room","zh":"浴室／臥室／客廳"},{"w":"dining room / kitchen / garage","zh":"飯廳／廚房／車庫"},{"w":"window / sofa / swimming pool / garden","zh":"窗／沙發／游泳池／花園"},{"w":"behind / in front of","zh":"在後面／在前面"},{"w":"between / next to / near","zh":"在兩者之間／旁邊／附近"},{"w":"team","zh":"隊伍","extra":"be on a team"},{"w":"hard-working / smart / busy","zh":"認真／聰明／忙碌"},{"w":"area / pocket / shoulder","zh":"區域／口袋／肩膀"},{"w":"spider / panda","zh":"蜘蛛／熊貓"},{"w":"water bottle","zh":"水瓶","extra":"a bottle of water"},{"w":"player / cheer","zh":"選手／歡呼","extra":"cheer for sb."}],"notes":["There is + 單數；There are + 複數","inside / on / under / behind / in front of / between / next to / near","be ready for + N","Let’s get the ball rolling! 表示『開始行動吧』"],"truth":"The Iron Animal 是仿鐵人三項設計的虛構動物競賽；動物角色與比賽位置均為教材故事設定。"},{"theme":"Tainan Night Market & Chimei Museum","focus":"現在進行式與場景描述","dialogue":[{"text":"(Ted and Matt are at a night market. Matt is on a video call with his mom.)"},{"speaker":"Matt","text":"Hi, Mom. How are you doing today?"},{"speaker":"Mom","text":"Great!"},{"speaker":"Matt","text":"What are you doing?"},{"speaker":"Mom","text":"I’m having breakfast with your Aunt May."},{"speaker":"Aunt","text":"Hi, Matt. What time is it there?"},{"speaker":"Matt","text":"It’s 7 p.m. I’m at a big night market in Tainan now. Ted is showing me around."},{"speaker":"Mom","text":"Wow, there are so many people around you!"},{"speaker":"Ted","text":"Yeah, this night market is really famous."},{"speaker":"Matt","text":"There are so many fun games here!"},{"speaker":"Mom","text":"What are those people playing?"},{"speaker":"Matt","text":"Some people are playing pinball, and some kids are playing ring toss."},{"text":"(Ted and Matt are trying some famous snacks.)"},{"speaker":"Ted","text":"This is bubble milk tea."},{"speaker":"Matt","text":"It’s yummy! Oh, what’s that in your hand?"},{"speaker":"Ted","text":"Just take a bite. It’s famous."},{"speaker":"Aunt","text":"How is it?"},{"speaker":"Matt","text":"Not bad. So, what is it?"},{"speaker":"Ted","text":"It’s pig blood cake!"},{"speaker":"Mom & Aunt","text":"What?! PIG BLOOD in a cake?"},{"speaker":"Matt","text":"But… it’s good."},{"speaker":"Mom","text":"OK, enjoy the umm… food, and have a good time."}],"readingTitle":"A Museum for All","reading":["It’s a sunny afternoon in Tainan. Ted and Matt are having a good time at the Chimei Museum.","The Chimei Museum is a great place. Inside the museum, there are shops, restaurants, and showrooms.","Some people are lining up for tickets. Some people are looking at the artworks.","Outside the museum, there is a bridge. Ted and Matt are taking selfies. There is also a beautiful meadow.","Some people are taking pictures, and some families are picnicking. Everyone is having fun.","The Chimei Museum is not just about art. It is also a place of joy. It is a museum for all."],"words":[{"w":"night market / video call","zh":"夜市／視訊電話","extra":"be on a video call with sb."},{"w":"breakfast","zh":"早餐","extra":"have breakfast"},{"w":"aunt","zh":"阿姨、姑姑、伯母、舅媽"},{"w":"many people","zh":"許多人","extra":"many + 可數複數；people 本身為複數"},{"w":"kid / snack","zh":"小孩／小吃"},{"w":"enjoy","zh":"享受","extra":"enjoy + N / V-ing"},{"w":"show sb. around","zh":"帶某人參觀"},{"w":"grass / picnic","zh":"草地／野餐"},{"w":"line up","zh":"排隊","extra":"line up for tickets"},{"w":"feed","zh":"餵食","extra":"feed A to B；feed on… 以……為食"},{"w":"take pictures / camera","zh":"拍照／相機"},{"w":"paint","zh":"畫畫","extra":"paint a picture；一字多義：油漆、塗上顏色"},{"w":"puppy","zh":"幼犬"},{"w":"museum / showroom / artwork","zh":"博物館／展示廳／藝術品"},{"w":"sunny","zh":"晴朗的"},{"w":"shop","zh":"商店","extra":"一字多義：shop (v.) 購物"},{"w":"restaurant","zh":"餐廳"},{"w":"ticket","zh":"票","extra":"line up for / book tickets；一字多義：罰單"},{"w":"outside","zh":"在……外面","extra":"也可作副詞：go outside"},{"w":"bridge / meadow","zh":"橋／草坪"},{"w":"also","zh":"也","extra":"be also / also + 一般動詞"},{"w":"art / joy","zh":"藝術／喜悅","extra":"for joy；a place of joy"},{"w":"selfie","zh":"自拍照","extra":"take a selfie with sb."}],"notes":["現在進行式：be + V-ing","have breakfast 中 have 表『用餐』","line up for + 事物；take selfies with + 人事物","everyone 是第三人稱單數：Everyone is…"],"truth":"奇美博物館位於臺南，課文所述館內外場景為教材化描述；Ted、Matt 及視訊情節為虛構角色與情境。"},{"theme":"Superheroes & Saving the Earth","focus":"can、能力表達與問題—解方","dialogue":[{"text":"(Dr. Devil is attacking the Earth. Captain Brave is looking for new members.)"},{"speaker":"Captain Brave","text":"The Earth is in danger. Please help us."},{"speaker":"Clunk","text":"I am Clunk. I am strong. I can move anything!"},{"speaker":"Captain Brave","text":"How about a mountain?"},{"speaker":"Clunk","text":"No sweat!"},{"speaker":"Captain Brave","text":"So, what can you do, young man?"},{"speaker":"Speedman","text":"I am Speedman. I can run very fast!"},{"speaker":"Captain Brave","text":"How fast?"},{"speaker":"Speedman","text":"Just like a flash! No one can catch me."},{"speaker":"Captain Brave","text":"Great. And you are?"},{"speaker":"Ice Queen","text":"I am Ice Queen. I can freeze anything!"},{"speaker":"Captain Brave","text":"Even the ocean?"},{"speaker":"Ice Queen","text":"No problem!"},{"speaker":"Captain Brave","text":"You are all in. Let’s save the world now!"}],"readingTitle":"A Letter from the Solomon Islands","reading":["Dear Super 4,","The Solomon Islands are in trouble! The Earth is too hot, and the ice is melting. So, the sea level is rising. We are losing our home.","I cannot help my people, but you can!","Ice Queen, you can freeze anything. Please freeze the ocean and cool down the Earth.","Clunk, you are strong. Please move the houses to a safe place.","Captain Brave, you are a great speaker. Please tell the world about our problem.","Can you help us? Please save the Solomon Islands!","Love, Kathy"],"words":[{"w":"attack","zh":"攻擊","extra":"一字多義：比賽中進攻；heart attack 心臟病發"},{"w":"Earth","zh":"地球","extra":"the Earth；earth 小寫可指土地、地面"},{"w":"member","zh":"成員","extra":"a member of…"},{"w":"move","zh":"移動","extra":"move sth. to…；一字多義：搬家、使感動"},{"w":"anything","zh":"任何事情"},{"w":"mountain","zh":"山"},{"w":"fast","zh":"快速地","extra":"一字多義：fast (adj.) 快速的"},{"w":"queen","zh":"皇后","extra":"queen-size bed 加大床"},{"w":"even","zh":"甚至","extra":"一字多義：偶數的；平手的"},{"w":"No problem! / No sweat!","zh":"沒問題／小事一樁"},{"w":"save","zh":"拯救","extra":"save energy 節能；save money 存錢"},{"w":"danger","zh":"危險","extra":"be in danger"},{"w":"flash / freeze / ocean","zh":"閃光／結冰／海洋","extra":"freeze 亦可表示『不許動』；frozen 結凍的"},{"w":"sun / moon / star","zh":"太陽／月亮／星星","extra":"star (v.) 由……主演"},{"w":"river / lake / sea / island / rainbow","zh":"河／湖／海／島／彩虹"},{"w":"dear","zh":"親愛的","extra":"一字多義：珍視的、寶貴的"},{"w":"trouble","zh":"麻煩","extra":"be in trouble"},{"w":"ice / level","zh":"冰／平面","extra":"sea level 海平面"},{"w":"rise","zh":"上升","extra":"the sun rises；rise–rose–risen"},{"w":"lose","zh":"失去","extra":"lose one’s home / lose a ticket"},{"w":"safe","zh":"安全的","extra":"a safe place；safe to + V"},{"w":"tell","zh":"告訴","extra":"tell sb. about sth."},{"w":"super","zh":"超級的","extra":"一字多義：super (adv.) 非常地"},{"w":"melt / speaker","zh":"融化／演說家"}],"notes":["can / cannot + 原形動詞","How about + 名詞？","cool down 使冷卻；tell sb. about sth.","Problem → Cause → Effect → Proposed solutions"],"truth":"索羅門群島是真實國家，海平面上升與氣候風險也是真實議題；Super 4、Kathy 的求救信及超能力解方是虛構教材情節，不能當成真實解決方案。"}],"grade8":[{"theme":"Weather & Climate","focus":"天氣描述、過去式與問題—解方","dialogue":[{"text":"(Brian and Rita are talking after the rain.)"},{"speaker":"Brian","text":"The rain finally stopped. It is sunny now."},{"speaker":"Rita","text":"Yes, but it is still very hot."},{"speaker":"Brian","text":"Let’s go inside and turn on the air conditioner."},{"speaker":"Rita","text":"Good idea. The weather is getting stranger every year."}],"readingTitle":"Change, or Go Under!","reading":["Our planet is getting warmer, and the sea level is rising.","For people on low islands, climate change is not a distant problem.","Their homes may go under water.","We can save energy, use less plastic, and choose greener transportation.","Small changes become powerful when many people act together."],"words":[{"w":"weather","zh":"天氣","extra":"weather report；under the weather 身體不舒服"},{"w":"climate","zh":"氣候","extra":"climate change 氣候變遷"},{"w":"rain","zh":"雨；下雨","extra":"heavy rain；rainy (adj.)"},{"w":"sunny / cloudy / windy","zh":"晴朗／多雲／多風的"},{"w":"temperature","zh":"溫度","extra":"a high / low temperature"},{"w":"air conditioner","zh":"冷氣機","extra":"turn on / off the air conditioner"},{"w":"change","zh":"改變；零錢","extra":"climate change；change A into B"},{"w":"planet / Earth","zh":"行星／地球","extra":"on Earth；the Earth"},{"w":"sea level","zh":"海平面","extra":"rise ≠ raise：sea levels rise"},{"w":"go under","zh":"沉沒；失敗"},{"w":"energy","zh":"能源；精力","extra":"save energy；full of energy"},{"w":"plastic","zh":"塑膠；塑膠的","extra":"single-use plastic"},{"w":"transportation","zh":"交通運輸"},{"w":"together","zh":"一起","extra":"work together"}],"notes":["How is the weather? = What is the weather like?","stop + V-ing：停止正在做的事","get + 比較級：逐漸變得更……","問題—原因—影響—可行解方"],"truth":"全球暖化與海平面上升是可驗證的科學議題；課文人物與對話為教材情境。單一事件不能直接等同長期氣候趨勢。"},{"theme":"Health & Colds","focus":"身體不適、過去式與比較對照","dialogue":[{"text":"(Bella calls Scott.)"},{"speaker":"Bella","text":"Hi, Scott. You weren’t at school today. What happened?"},{"speaker":"Scott","text":"I caught a cold and had a fever."},{"speaker":"Bella","text":"Did you see a doctor?"},{"speaker":"Scott","text":"No, I didn’t. I stayed home and rested."},{"speaker":"Bella","text":"Drink some water and get well soon."}],"readingTitle":"Cool Ways to Treat a Cold","reading":["People around the world treat a cold in different ways.","Some drink warm soup or tea. Others eat special foods.","These home remedies may help people feel better, but they do not cure every illness.","Rest, fluids, and proper medical advice are important.","Compare the remedies: What is similar, and what is different?"],"words":[{"w":"cold","zh":"感冒；寒冷的","extra":"catch / have a cold；cold water"},{"w":"fever","zh":"發燒","extra":"have / run a fever"},{"w":"happen","zh":"發生","extra":"What happened to you?"},{"w":"doctor","zh":"醫師","extra":"see a doctor"},{"w":"rest","zh":"休息；其餘","extra":"get some rest；the rest of…"},{"w":"medicine","zh":"藥","extra":"take medicine；不可數名詞"},{"w":"cough","zh":"咳嗽；咳嗽聲"},{"w":"headache / stomachache","zh":"頭痛／胃痛","extra":"have a headache"},{"w":"sore throat","zh":"喉嚨痛"},{"w":"treat","zh":"治療；招待","extra":"treat a cold；my treat 我請客"},{"w":"remedy","zh":"療法、補救辦法","extra":"home remedy"},{"w":"warm","zh":"溫暖的；使暖和"},{"w":"fluid","zh":"液體","extra":"drink plenty of fluids"},{"w":"similar / different","zh":"相似／不同的","extra":"be similar to；be different from"},{"w":"get well","zh":"康復","extra":"Get well soon!"}],"notes":["catch–caught–caught；have–had–had","Did + 主詞 + 原形動詞？","some 用於肯定句，也常見於表示邀請或期望肯定回答的問句","比較文本：both / however / unlike"],"truth":"感冒多由病毒造成；偏方不能保證治癒，也不能取代專業醫療。若高燒、呼吸困難或症狀持續，應尋求醫療協助。"},{"theme":"Aesop’s Fable","focus":"過去進行式、敘事順序與寓意","dialogue":[{"text":"This lesson centers on a fable rather than a separate dialogue."},{"speaker":"Teacher","text":"What was Tina doing when she saw the water?"},{"speaker":"Student","text":"She was looking for something to drink."}],"readingTitle":"Tina the Crow and Billy the Chicken","reading":["Tina the Crow was very thirsty, so she looked everywhere for water.","At last, she found a container, but the water was too low.","Billy the Chicken watched her while she was trying different ideas.","Tina put small stones into the container one by one.","The water rose, and she could finally drink.","The story reminds us to think calmly and keep trying."],"words":[{"w":"crow","zh":"烏鴉"},{"w":"chicken","zh":"雞；雞肉","extra":"a chicken（雞）；chicken（雞肉，多不可數）"},{"w":"thirsty","zh":"口渴的","extra":"be thirsty for… 渴望……"},{"w":"look for","zh":"尋找","extra":"look at 看；look after 照顧"},{"w":"everywhere","zh":"到處"},{"w":"container","zh":"容器","extra":"a container of water"},{"w":"low","zh":"低的；低聲地","extra":"low water level"},{"w":"stone","zh":"石頭","extra":"one by one 一個接一個"},{"w":"rise","zh":"上升","extra":"rise–rose–risen；不接受詞"},{"w":"raise","zh":"舉起、提高","extra":"raise–raised–raised；後接受詞"},{"w":"finally","zh":"終於","extra":"at last / in the end"},{"w":"keep","zh":"保持、繼續","extra":"keep + V-ing"},{"w":"while","zh":"當……時","extra":"while + 持續動作"}],"notes":["was / were + V-ing：過去某時正在進行","too + adj. + to V：太……而不能……","動作順序：first, next, then, finally","寓言用擬人化角色傳達寓意，不是自然科學紀錄"],"truth":"本篇改編自寓言傳統；會投石取水的鳥類行為有研究觀察，但課文角色、姓名、對話及寓意安排均屬故事。"},{"theme":"Dream Jobs & YouTubers","focus":"未來計畫、職業與資訊判讀","dialogue":[{"text":"(Students are talking about future jobs.)"},{"speaker":"Student A","text":"What do you want to be in the future?"},{"speaker":"Student B","text":"I want to be a YouTuber."},{"speaker":"Student A","text":"Why?"},{"speaker":"Student B","text":"I enjoy making videos and sharing ideas."},{"speaker":"Teacher","text":"Remember: a channel also needs planning, practice, and responsibility."}],"readingTitle":"I Want to Be a YouTuber","reading":["A young gamer dreams of turning a hobby into a job.","Making a successful video takes more than playing games.","Creators plan topics, record, edit, check facts, and communicate with viewers.","They also need to respect copyright and protect personal information.","A dream becomes a plan when we understand both the fun and the work."],"words":[{"w":"future","zh":"未來","extra":"in the future"},{"w":"job / work","zh":"工作／工作","extra":"job 可數；work 多不可數，也可作動詞"},{"w":"YouTuber","zh":"YouTube 影音創作者"},{"w":"gamer","zh":"遊戲玩家"},{"w":"hobby","zh":"嗜好","extra":"take up a hobby"},{"w":"video","zh":"影片","extra":"make / upload a video"},{"w":"share","zh":"分享；一份","extra":"share A with B"},{"w":"channel","zh":"頻道；管道"},{"w":"creator","zh":"創作者","extra":"content creator"},{"w":"record","zh":"錄製；紀錄","extra":"record (v.) / record (n.) 重音不同"},{"w":"edit","zh":"編輯","extra":"edit a video；editor 編輯"},{"w":"viewer","zh":"觀眾","extra":"view (v./n.) 觀看／景色"},{"w":"successful","zh":"成功的","extra":"be successful in…"},{"w":"copyright","zh":"著作權","extra":"respect copyright"},{"w":"personal information","zh":"個人資訊","extra":"protect personal information"}],"notes":["want to be + 職業","enjoy + V-ing；plan to + V","take + 時間：It takes time to edit.","職涯討論同時檢視興趣、能力、工作內容與風險"],"truth":"YouTuber 是真實職業型態，但收入與成功無保證。訂閱數、觀看數或課文角色經歷若未提供可查來源，不應當作普遍事實。"},{"theme":"Welcome to Bangkok","focus":"旅遊規畫、過去式與事件順序","dialogue":[{"text":"(Friends are planning a trip to Bangkok.)"},{"speaker":"A","text":"What did you put on our travel list?"},{"speaker":"B","text":"The Maeklong Railway Market and some famous temples."},{"speaker":"A","text":"How will we get there?"},{"speaker":"B","text":"Let’s check the route and leave early."},{"speaker":"A","text":"Great. We should also respect local rules and customs."}],"readingTitle":"Welcome to Bangkok","reading":["Our day began early in Bangkok.","First, we traveled to the Maeklong Railway Market.","When a train approached, sellers moved their awnings and goods away from the tracks.","After the train passed, the market quickly returned to normal.","Later, we visited other places and tried local food.","Careful planning helped us enjoy the trip safely."],"words":[{"w":"Bangkok","zh":"曼谷"},{"w":"trip / travel","zh":"旅行／旅行","extra":"take a trip；travel abroad"},{"w":"plan","zh":"計畫；規畫","extra":"plan a trip；plan to + V"},{"w":"list","zh":"清單；列出","extra":"a travel list；list A as B"},{"w":"market","zh":"市場","extra":"night market；market (v.) 行銷"},{"w":"railway","zh":"鐵路","extra":"railway station"},{"w":"train","zh":"火車；訓練","extra":"take a train；train for…"},{"w":"approach","zh":"接近；方法","extra":"the train approaches；an approach to…"},{"w":"seller","zh":"賣家","extra":"sell–sold–sold"},{"w":"awning","zh":"遮雨棚"},{"w":"track","zh":"鐵軌；追蹤","extra":"railway tracks；keep track of"},{"w":"pass","zh":"經過；通過","extra":"pass by；pass a test"},{"w":"route","zh":"路線","extra":"check the route"},{"w":"local","zh":"當地的；當地人","extra":"local food"},{"w":"custom","zh":"習俗","extra":"customs 也可指海關"}],"notes":["過去式敘事：began, traveled, moved, passed, visited","when + 短事件；while + 持續動作","順序語：first, after, later","旅遊文本須區分教材行程與可驗證地點資訊"],"truth":"美功鐵道市場位於泰國，火車通過市場是其真實特色；營運時間、班次與安全規定會變動，上課不應把教材行程當成即時旅遊資訊。"},{"theme":"Directions in San Francisco","focus":"問路、指路與事實／意見","dialogue":[{"text":"(Visitors are trying to reach Lombard Street.)"},{"speaker":"Visitor","text":"Excuse me. How can we get to Lombard Street?"},{"speaker":"Local","text":"Go straight, turn at the corner, and follow the map."},{"speaker":"Visitor","text":"Can we take a cable car?"},{"speaker":"Local","text":"Yes, but check the route first."},{"speaker":"Visitor","text":"Thank you for your help."}],"readingTitle":"What Did People Say About the Department Store?","reading":["Several visitors wrote comments about a department store.","One wrote, “The store opened at ten.” That statement can be checked.","Another wrote, “It is the best store in town.” That is an opinion.","Words such as beautiful, boring, and best often signal personal judgment.","Good readers separate verifiable facts from opinions before making a decision."],"words":[{"w":"direction","zh":"方向；指示","extra":"ask for directions 常用複數"},{"w":"straight","zh":"直的；直地","extra":"go straight"},{"w":"turn","zh":"轉彎；輪到","extra":"turn left；It’s your turn."},{"w":"corner","zh":"轉角","extra":"at / around the corner"},{"w":"map","zh":"地圖","extra":"check / follow a map"},{"w":"cable car","zh":"纜車"},{"w":"block","zh":"街區；阻擋","extra":"two blocks away；block the road"},{"w":"department store","zh":"百貨公司"},{"w":"comment", ":"輕型機車"},{"w":"truck","zh":"卡車"},{"w":"turn left","zh":"左轉"},{"w":"straight","zh":"直地；直的"},{"w":"east / west / south","zh":"東方／西方／南方"},{"w":"shake / shook hands","zh":"握手"},{"w":"cheap","zh":"便宜的"},{"w":"clerk","zh":"店員"},{"w":"favorite","zh":"最喜愛的"},{"w":"visitor","zh":"訪客"},{"w":"Excuse me.","zh":"不好意思。"}]]};
const S={grade:7,lesson:0,tab:'activity',animal:0,reveal:false,qmode:'mixed',qi:0,qshow:false,rotation:0,picked:'',spinning:false};
const tabs=[['activity','Warm-up'],['dialogue','Dialogue'],['reading','Reading'],['vocab','Vocabulary'],['grammar','Grammar'],['quiz','出題工具'],['wheel','姓名輪盤'],['notes','Teacher Notes']];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const lessons=()=>S.grade===7?DATA.grade7:DATA.grade8, lesson=()=>lessons()[S.lesson], words=()=>S.grade===8?DATA.verified8[S.lesson]:lesson().words, grammar=()=> (S.grade===7?DATA.grammar7:DATA.grammar8)[S.lesson];
function head(n,en,zh){return '<header class="head"><b>'+n+'</b><div><h3>'+esc(en)+'</h3><p>'+esc(zh)+'</p></div></header>'}
function render(){const L=lesson();document.querySelector('#app').innerHTML='<nav class="grades"><button class="'+(S.grade===7?'on':'')+'" onclick="grade(7)">國一上｜南一第一冊 L1–L6</button><button class="'+(S.grade===8?'on':'')+'" onclick="grade(8)">國二上｜康軒第三冊 L1–L6</button></nav><nav class="lessons">'+lessons().map((x,i)=>'<button class="'+(i===S.lesson?'on':'')+'" onclick="goLesson('+i+')"><b>L'+(i+1)+'</b><span>'+esc(x.theme)+'</span></button>').join('')+'</nav><section class="hero"><div><small>LESSON '+(S.lesson+1)+'</small><h2>'+esc(L.theme)+'</h2><p>'+esc(L.focus)+'</p></div><aside class="source">✓ Source-checked<br><small>備課用書＋核准字詞表</small></aside></section><nav class="tabs">'+tabs.map(x=>'<button class="'+(S.tab===x[0]?'on':'')+'" onclick="tab(&quot;'+x[0]+'&quot;)">'+x[1]+'</button>').join('')+'</nav><article class="page">'+content()+'</article>';}
function content(){const L=lesson();if(S.tab==='activity')return warm();if(S.tab==='dialogue')return head('01','Dialogue','課本對話')+'<div class="dialogue">'+L.dialogue.map(x=>x.speaker?'<div class="line"><b>'+esc(x.speaker)+'</b><p>'+esc(x.text)+'</p></div>':'<p class="scene">'+esc(x.text)+'</p>').join('')+'</div>';if(S.tab==='reading')return head('02',L.readingTitle,'課本閱讀')+'<div class="reading">'+L.reading.map(x=>'<p>'+esc(x)+'</p>').join('')+'</div>';if(S.tab==='vocab')return vocab();if(S.tab==='grammar')return gram();if(S.tab==='quiz')return quiz();if(S.tab==='wheel')return wheel();return head('07','Teacher Notes','教學焦點與事實檢核')+'<div class="box">'+L.notes.map(x=>'<p>• '+esc(x)+'</p>').join('')+'</div><div class="truth"><h3>Fact-check Boundary</h3><p>'+esc(L.truth)+'</p></div>'}
function warm(){if(S.grade!==7||S.lesson!==0)return head('00','Teacher Warm-up','全班口說暖身')+'<div class="box"><p>請學生先看課名，和同桌說出三個可能出現的英文關鍵字。</p></div>';const a=[['🐘','elephant',['I am big and strong.','I have a long nose.','What am I?']],['🐸','frog',['I am small and green.','I can jump.','What am I?']],['🐻','bear',['I am brown and strong.','I like fruit.','What am I?']]][S.animal];return head('00','Mystery Animal Show','猜動物暖身')+'<div class="animal"><div class="clue">'+a[2].map(x=>'<p>'+x+'</p>').join('')+(S.reveal?'<div class="answer">'+a[0]+' It is a '+a[1]+'!</div>':'')+'</div><div class="actions" style="flex-direction:column"><button onclick="S.reveal=!S.reveal;render()">'+(S.reveal?'隱藏答案':'揭曉答案')+'</button><button onclick="S.animal=(S.animal+1)%3;S.reveal=false;render()">下一題</button></div></div>'}
function vocab(){return head('03','Vocabulary Lab','經來源核准的生詞與用法')+'<p class="note">'+(S.grade===7?'南一生詞表及各課單字解析。':'只收錄康軒 115-1 第三冊附件標示為該課的字詞。')+'</p><div class="vocab">'+words().map(x=>'<div class="word"><b>'+esc(x.w)+'</b><span>'+esc(x.zh)+'</span>'+(x.extra?'<p>'+esc(x.extra)+'</p>':'')+'</div>').join('')+'</div>'}
function gram(){const g=grammar();return head('04','Grammar',g.title)+'<div class="grammar"><section class="box"><h4>FORM</h4>'+g.forms.map(x=>'<p>'+esc(x)+'</p>').join('')+'</section><section class="box"><h4>MODEL SENTENCES</h4>'+g.examples.map(x=>'<p>'+esc(x)+'</p>').join('')+'</section><section class="box checks"><h4>QUICK CHECK</h4>'+g.checks.map((x,i)=>'<details><summary>'+(i+1)+'. '+esc(x.q)+'</summary><p>'+esc(x.a)+'</p></details>').join('')+'</section></div>'}
function pool(){const v=words().map(x=>({q:'What does “'+x.w+'” mean?',a:x.zh,tag:'VOCAB'})),g=grammar().checks.map(x=>({q:x.q,a:x.a,tag:'GRAMMAR'}));return S.qmode==='vocab'?v:S.qmode==='grammar'?g:v.concat(g)}
function quiz(){const p=pool(),x=p[S.qi%p.length];return head('05','Question Generator','老師投影出題・答案可隱藏')+'<div class="modes">'+[['mixed','混合'],['vocab','單字'],['grammar','文法']].map(m=>'<button class="'+(S.qmode===m[0]?'on':'')+'" onclick="mode(&quot;'+m[0]+'&quot;)">'+m[1]+'</button>').join('')+'</div><div class="quiz-card"><b>'+x.tag+'</b><h3>'+esc(x.q)+'</h3>'+(S.qshow?'<p>'+esc(x.a)+'</p>':'')+'</div><div class="actions"><button onclick="S.qshow=!S.qshow;render()">'+(S.qshow?'隱藏答案':'揭曉答案')+'</button><button onclick="S.qi++;S.qshow=false;render()">下一題</button></div>'}
function getNames(){return (localStorage.getItem('miffy-student-roster')||'').split(/[\n,，]+/).map(x=>x.trim()).filter(Boolean)}
function wheel(){const n=getNames(),colors=['#f0bd52','#d65c43','#2e705d','#7fa7b8','#e9a26f','#8b80b6'],bg=n.length?'conic-gradient('+n.map((_,i)=>colors[i%colors.length]+' '+i*360/n.length+'deg '+(i+1)*360/n.length+'deg').join(',')+')':'#e3ecf0';return head('06','Student Name Wheel','教師抽學生・本機自動保存名單')+'<div class="wheel-layout"><section class="wheel-stage"><i class="pointer">▼</i><div class="wheel" style="background:'+bg+';transform:rotate('+S.rotation+'deg)"><b>'+n.length+' 人</b></div><button class="spinbtn" '+(!n.length||S.spinning?'disabled':'')+' onclick="spin()">'+(S.spinning?'抽選中…':'開始抽學生')+'</button>'+(S.picked?'<p class="picked">🎉 '+esc(S.picked)+'</p>':'')+'</section><section class="box roster"><h3>班級名單</h3><p>每行一位，也可用逗號分隔；自動保存在這台電腦。</p><textarea oninput="saveNames(this.value)" placeholder="01 王小明&#10;02 李小華">'+esc(localStorage.getItem('miffy-student-roster')||'')+'</textarea><small>目前共 '+n.length+' 人｜學生不需要手機。</small></section></div>'}
function grade(g){S.grade=g;S.lesson=0;S.tab=g===7?'activity':'dialogue';render()}function goLesson(i){S.lesson=i;S.tab=S.grade===7&&i===0?'activity':'dialogue';render()}function tab(t){S.tab=t;render()}function mode(m){S.qmode=m;S.qi=0;S.qshow=false;render()}function saveNames(v){localStorage.setItem('miffy-student-roster',v);render()}function spin(){const n=getNames();if(!n.length)return;S.spinning=true;S.picked='';S.rotation+=1440+Math.floor(Math.random()*360);render();setTimeout(()=>{S.picked=n[Math.floor(Math.random()*n.length)];S.spinning=false;render()},1700)}render();
</script></body></html>

<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>即時互動調查 2 ── 寫作教學挑戰</title>
    <script src="web_photos/vendor/tailwindcss.js"></script>
    <link href="web_photos/vendor/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-[#f8f5eb] text-slate-800 font-sans p-4 min-h-screen flex flex-col justify-center items-center">
    <div class="max-w-md w-full bg-white rounded-2xl p-6 shadow-xl border border-[#efe8d3]">
        <div class="inline-flex items-center gap-2 px-3 py-1 bg-[#efe8d3] text-[#ea580c] rounded-full text-xs font-bold mb-3">
            <i class="fa-solid fa-pen-nib"></i> 寫作教學即時挑戰
        </div>

        <h2 class="text-xl font-black text-slate-800 mb-2">在引導英文寫作時，您認為哪個要素最難引導學生寫好？</h2>
        <p class="text-xs text-slate-500 mb-4">請選擇您認為最挑戰的一項：</p>

        <form id="pollForm" class="space-y-3">
            <label class="flex items-center gap-3 p-3 rounded-xl border border-sand-200 bg-[#fdfbf7] cursor-pointer hover:bg-[#efe8d3]/50 transition">
                <input type="radio" name="writing_option" value="A" class="w-5 h-5 text-orange-600">
                <span class="text-sm font-medium text-slate-700">🪝 Hook (吸引人的第一句開頭)</span>
            </label>

            <label class="flex items-center gap-3 p-3 rounded-xl border border-sand-200 bg-[#fdfbf7] cursor-pointer hover:bg-[#efe8d3]/50 transition">
                <input type="radio" name="writing_option" value="B" class="w-5 h-5 text-orange-600">
                <span class="text-sm font-medium text-slate-700">🌉 Bridge (連結體驗與主題的橋樑)</span>
            </label>

            <label class="flex items-center gap-3 p-3 rounded-xl border border-sand-200 bg-[#fdfbf7] cursor-pointer hover:bg-[#efe8d3]/50 transition">
                <input type="radio" name="writing_option" value="C" class="w-5 h-5 text-orange-600">
                <span class="text-sm font-medium text-slate-700">📌 Thesis Statement (核心論文句)</span>
            </label>

            <button type="button" onclick="submitVote()" class="w-full py-3 bg-[#ea580c] text-white font-bold rounded-xl text-sm hover:bg-[#c2410c] transition shadow-lg mt-4">
                <i class="fa-solid fa-paper-plane mr-2"></i> 送出選擇
            </button>
        </form>

        <div id="thankYou" class="hidden mt-6 pt-4 border-t border-sand-200 text-center">
            <div class="w-12 h-12 bg-orange-100 text-orange-600 rounded-full flex items-center justify-center mx-auto mb-2 text-xl">
                <i class="fa-solid fa-check"></i>
            </div>
            <h3 class="font-bold text-slate-800 text-base mb-1">選擇已送出！</h3>
            <p class="text-xs text-slate-500">感謝您的參與！請觀看螢幕上 Miffy 老師的解題分享。</p>
        </div>
    </div>

    <script>
        function submitVote() {
            document.getElementById('pollForm').classList.add('hidden');
            document.getElementById('thankYou').classList.remove('hidden');
        }
    </script>
</body>
</html>
